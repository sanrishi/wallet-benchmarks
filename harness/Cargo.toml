[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[features]
default = []
library_wallet = ["dep:minotari_wallet"]

[dependencies]
tokio = { version = "=1.48.0", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
tonic = "=0.13.0"
prost = "=0.13.5"
reqwest = { version = "=0.12.24", features = ["blocking", "json"] }
sysinfo = "=0.37.2"
tari_utilities = "0.10"
chrono = "=0.4.42"
async-trait = "=0.1.89"
anyhow = "=1.0.100"
futures = "=0.3.30"
tari_common = "=5.3.1"
tari_common_types = "=5.3.1"
tari_transaction_components = "=5.3.1"
tempfile = "=3.27.0"
minotari_wallet = { version = "=5.3.1", optional = true, default-features = true }

[dev-dependencies]
pretty_assertions = "1"
regex = "1"

[build-dependencies]
tonic-build = "=0.13.0"
protoc-bin-vendored = "3.0.0"
prost-build = "=0.13.5"
