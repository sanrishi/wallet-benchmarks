[package]
name = "harness"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.48.0", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
toml = "=0.9.8"
tonic = { version = "=0.13.0", features = ["tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
prost = "=0.13.5"
reqwest = { version = "=0.12.24", features = ["blocking", "json"] }
sysinfo = "=0.37.2"
tari_utilities = "0.10"
chrono = "=0.4.42"
async-trait = "=0.1.89"
anyhow = "=1.0.100"
futures = "=0.3.30"
tari_common = "=5.6.0-pre.1"
tari_common_types = "=5.6.0-pre.1"
tari_transaction_components = "=5.6.0-pre.1"
tempfile = "=3.27.0"
hex = "=0.4.3"

[dev-dependencies]
pretty_assertions = "1"
regex = "1"
wiremock = "0.6"
proptest = "1"

[build-dependencies]
tonic-build = "=0.13.0"
protoc-bin-vendored = "3.0.0"
prost-build = "=0.13.5"
