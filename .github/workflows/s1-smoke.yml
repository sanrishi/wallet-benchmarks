name: S1 Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [feat/harness-implementation]

env:
  CARGO_TERM_COLOR: always

jobs:
  s1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download and extract Tari suite
        run: |
          curl -fL -o /tmp/tari_suite.zip \
            "https://github.com/tari-project/tari/releases/download/v5.3.1/tari_suite-5.3.1-esme-bc0e4f2-linux-x86_64.zip"
          mkdir -p tools
          unzip -o /tmp/tari_suite.zip -d tools/
          chmod +x tools/minotari_*
          ls -la tools/

      - name: Configure binary paths
        run: |
          ABS_TOOLS="$(pwd)/tools"
          sed -i "s|wallet_bin = \"\"|wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml
          sed -i "s|minotari_bin = \"\"|minotari_bin = \"$ABS_TOOLS/minotari\"|" micro_config.toml
          sed -i "s|payment_processor_bin = \"\"|payment_processor_bin = \"$ABS_TOOLS/minotari_payment_processor\"|" micro_config.toml
          sed -i "s|console_wallet_bin = \"\"|console_wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml

      - name: Start base node (with PTY to avoid crossterm crash)
        run: |
          # Create a PTY so the node's interactive console works without a real TTY
          which script || apt-get update -qq && apt-get install -y -qq bsdmainutils 2>/dev/null
          script -q -c "./tools/minotari_node --network esmeralda --grpc-enabled \
            --grpc-address /ip4/127.0.0.1/tcp/18142 \
            -p base_node.grpc_server_allow_methods=\"\" \
            -p base_node.mining_enabled=true" \
            /tmp/node.log > /dev/null 2>&1 &
          NODE_PID=$!
          echo "Node PID: $NODE_PID"
          sleep 20
          ps aux | grep minotari_node | grep -v grep || { echo "Node NOT running!"; exit 1; }
          echo "--- Node log (first 10 lines) ---"
          head -10 /tmp/node.log 2>/dev/null

      - name: Wait for node sync (parse log for progress)
        run: |
          echo "Waiting for node to sync headers..."
          for i in $(seq 1 300); do
            # Parse the last line showing sync progress (e.g. "185732/722736 (25%)")
            LINE=$(grep -oP 'Syncing headers:.*?\d+/\d+' /tmp/node.log | tail -1)
            if [ -n "$LINE" ]; then
              HEIGHTS=$(echo "$LINE" | grep -oP '\d+/\d+' | tail -1)
              CURRENT=$(echo "$HEIGHTS" | cut -d/ -f1)
              TOTAL=$(echo "$HEIGHTS" | cut -d/ -f2)
              PCT=$((CURRENT * 100 / TOTAL))
              echo "[$i] $CURRENT/$TOTAL ($PCT%) — $(tail -1 /tmp/node.log)"
              if [ "$PCT" -ge 95 ] 2>/dev/null; then
                echo "Header sync past 95%, proceeding..."
                break
              fi
            else
              # Show whatever the latest log line is
              echo "[$i] $(tail -1 /tmp/node.log)"
            fi
            ps aux | grep minotari_node | grep -v grep || {
              echo "Node crashed!"; tail -30 /tmp/node.log; exit 1
            }
            sleep 60
          done
          echo "--- Final tail ---"
          tail -10 /tmp/node.log
          set -e

      - name: Build harness
        run: cargo build --release --manifest-path harness/Cargo.toml

      - name: Run S1 scenario
        id: s1
        continue-on-error: true
        run: |
          cd harness
          cargo run --release -- --config ../micro_config.toml --scenario S1 2>&1 | tee /tmp/s1_output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-result
          path: /tmp/s1_output.txt
          retention-days: 30
