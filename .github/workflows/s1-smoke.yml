name: S1 Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [feat/harness-implementation]

env:
  CARGO_TERM_COLOR: always

jobs:
  s1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download and extract Tari suite
        run: |
          curl -fL -o /tmp/tari_suite.zip \
            "https://github.com/tari-project/tari/releases/download/v5.3.1/tari_suite-5.3.1-esme-bc0e4f2-linux-x86_64.zip"
          mkdir -p tools
          unzip -o /tmp/tari_suite.zip -d tools/
          chmod +x tools/minotari_*
          ls -la tools/

      - name: Configure binary paths
        run: |
          ABS_TOOLS="$(pwd)/tools"
          sed -i "s|wallet_bin = \"\"|wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml
          sed -i "s|minotari_bin = \"\"|minotari_bin = \"$ABS_TOOLS/minotari\"|" micro_config.toml
          sed -i "s|payment_processor_bin = \"\"|payment_processor_bin = \"$ABS_TOOLS/minotari_payment_processor\"|" micro_config.toml
          sed -i "s|console_wallet_bin = \"\"|console_wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml

      - name: Start base node
        run: |
          ./tools/minotari_node --network esmeralda --grpc-enabled \
            --grpc-address /ip4/127.0.0.1/tcp/18142 \
            --non-interactive-mode \
            -p base_node.grpc_server_allow_methods="" \
            -p base_node.mining_enabled=true \
            > /tmp/node.log 2>&1 &
          echo "Node PID: $!"
          sleep 30
          ps aux | grep minotari_node | grep -v grep || echo "Node NOT running"
          echo "--- Last 10 log lines ---"
          tail -10 /tmp/node.log 2>/dev/null || echo "(log empty)"

      - name: Wait for node gRPC to become available
        run: |
          echo "Waiting for gRPC endpoint..."
          for i in $(seq 1 30); do
            curl -s --connect-timeout 2 http://127.0.0.1:18142 2>/dev/null && break
            ps aux | grep minotari_node | grep -v grep || {
              echo "Node crashed!"
              tail -20 /tmp/node.log
              exit 1
            }
            sleep 5
          done

      - name: Wait for node sync (poll gRPC tip info)
        run: |
          # Install grpcurl
          curl -sL "https://github.com/fullstorydev/grpcurl/releases/download/v1.9.3/grpcurl_1.9.3_linux_x86_64.tar.gz" -o /tmp/grpcurl.tar.gz
          tar xzf /tmp/grpcurl.tar.gz -C /tmp
          chmod +x /tmp/grpcurl

          set +e
          for i in $(seq 1 300); do
            # Query tip info via gRPC
            TIP_JSON=$(/tmp/grpcurl -plaintext -d '' 127.0.0.1:18142 tari.rpc.BaseNode/GetTipInfo 2>/dev/null)
            TIP_HEIGHT=$(echo "$TIP_JSON" | grep -oP '"best_block_height":\s*\K[0-9]+')
            SYNC_PROGRESS=$(echo "$TIP_JSON" | grep -oP '"sync_progress":\s*\{\s*"local_height":\s*\K[0-9]+')
            echo "[$i] Best block: $TIP_HEIGHT | Local sync: $SYNC_PROGRESS"

            # Check if node is syncing or has synced
            if [ -n "$TIP_HEIGHT" ] && [ "$TIP_HEIGHT" -gt 1000 ] 2>/dev/null; then
              # Tip is beyond genesis — node is connected and syncing
              # Wait until tip passes 700000
              if [ "$TIP_HEIGHT" -ge 700000 ] 2>/dev/null; then
                echo "Sync complete at height $TIP_HEIGHT!"
                break
              fi
            fi

            ps aux | grep minotari_node | grep -v grep || {
              echo "Node crashed!"
              tail -20 /tmp/node.log
              exit 1
            }

            # Also show node log for progress context
            grep -oP 'Syncing headers:.*\d+/\d+' /tmp/node.log | tail -1 || echo "(no sync line in log)"
            sleep 60
          done
          set -e

      - name: Build harness
        run: cargo build --release --manifest-path harness/Cargo.toml

      - name: Run S1 scenario
        id: s1
        continue-on-error: true
        run: |
          cd harness
          cargo run --release -- --config ../micro_config.toml --scenario S1 2>&1 | tee /tmp/s1_output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-result
          path: /tmp/s1_output.txt
          retention-days: 30
