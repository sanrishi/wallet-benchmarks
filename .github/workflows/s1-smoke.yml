name: S1 Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [feat/harness-implementation]

env:
  CARGO_TERM_COLOR: always

jobs:
  s1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Download and extract Tari suite
        run: |
          curl -fL -o /tmp/tari_suite.zip \
            "https://github.com/tari-project/tari/releases/download/v5.3.1/tari_suite-5.3.1-esme-bc0e4f2-linux-x86_64.zip"
          mkdir -p tools
          unzip -o /tmp/tari_suite.zip -d tools/
          chmod +x tools/minotari_*

      - name: Build minotari CLI from source
        run: |
          git clone --depth 1 https://github.com/tari-project/minotari-cli.git /tmp/minotari-cli
          cargo build --release --manifest-path /tmp/minotari-cli/minotari/Cargo.toml
          cp /tmp/minotari-cli/target/release/minotari tools/
          chmod +x tools/minotari

      - name: Configure binary paths
        run: |
          ABS_TOOLS="$(pwd)/tools"
          sed -i "s|wallet_bin = \"\"|wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml
          sed -i "s|minotari_bin = \"\"|minotari_bin = \"$ABS_TOOLS/minotari\"|" micro_config.toml
          sed -i "s|payment_processor_bin = \"\"|payment_processor_bin = \"$ABS_TOOLS/minotari_payment_processor\"|" micro_config.toml
          sed -i "s|console_wallet_bin = \"\"|console_wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml

      - name: Build harness
        run: cargo build --release --manifest-path harness/Cargo.toml

      - name: Start base node and wait for sync
        run: |
          mkdir -p node_data
          echo "n" | ./tools/minotari_node --init --base-path node_data --network esmeralda 2>&1
          # Unlock gRPC methods needed for scanning + tx submission
          CFG="node_data/esmeralda/config/config.toml"
          for m in get_tip_info get_sync_progress submit_transaction get_blocks get_header_by_hash get_block_timing list_headers check_for_updates get_sync_info get_network_status get_mempool_transactions get_tokens_in_circulation get_network_difficulty get_new_block_template get_new_block; do
            sed -i "s/#\"$m\"/\"$m\"/" "$CFG"
          done
          echo "--- Starting node ---"
          ./tools/minotari_node --grpc-enabled --non-interactive --base-path node_data --network esmeralda > /tmp/node.log 2>&1 &
          NODE_PID=$!
          echo "node_pid=$NODE_PID"
          for i in $(seq 1 60); do
            if ss -tlnp 2>/dev/null | grep -q 18142; then
              echo "Node gRPC ready after ${i}s"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Node failed to start gRPC within 60s"
              tail -30 /tmp/node.log
              exit 1
            fi
            sleep 1
          done
          echo "Waiting 180s for initial sync..."
          sleep 180
          echo "Sync wait done, node log tail:"
          tail -30 /tmp/node.log

      - name: Run S1 scenario
        id: s1
        continue-on-error: true
        run: |
          cd harness
          cargo run --release -- --config ../micro_config.toml --scenario S1 2>&1 | tee /tmp/s1_output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-result
          path: /tmp/s1_output.txt
          retention-days: 30
