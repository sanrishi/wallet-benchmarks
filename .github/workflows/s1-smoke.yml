name: S1 Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [feat/harness-implementation]

env:
  CARGO_TERM_COLOR: always

jobs:
  s1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Download and extract Tari suite
        run: |
          curl -fL -o /tmp/tari_suite.zip \
            "https://github.com/tari-project/tari/releases/download/v5.3.1/tari_suite-5.3.1-esme-bc0e4f2-linux-x86_64.zip"
          mkdir -p tools
          unzip -o /tmp/tari_suite.zip -d tools/
          chmod +x tools/minotari_*
          ls -la tools/

      - name: Configure binary paths
        run: |
          ABS_TOOLS="$(pwd)/tools"
          sed -i "s|wallet_bin = \"\"|wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml
          sed -i "s|minotari_bin = \"\"|minotari_bin = \"$ABS_TOOLS/minotari\"|" micro_config.toml
          sed -i "s|payment_processor_bin = \"\"|payment_processor_bin = \"$ABS_TOOLS/minotari_payment_processor\"|" micro_config.toml
          sed -i "s|console_wallet_bin = \"\"|console_wallet_bin = \"$ABS_TOOLS/minotari_console_wallet\"|" micro_config.toml

      - name: Start base node
        run: |
          ./tools/minotari_node --network esmeralda --grpc-enabled \
            --grpc-address /ip4/127.0.0.1/tcp/18142 \
            -p base_node.grpc_server_allow_methods="" \
            -p base_node.mining_enabled=true \
            > /tmp/node.log 2>&1 &
          echo "Node PID: $!"
          sleep 30
          ps aux | grep minotari_node | grep -v grep || echo "Node NOT running"
          echo "--- Last 10 log lines ---"
          tail -10 /tmp/node.log 2>/dev/null || echo "(log empty)"

      - name: Wait for node to sync (checking log every 60s)
        run: |
          set +e
          for i in $(seq 1 300); do
            LINE=$(tail -1 /tmp/node.log 2>/dev/null)
            echo "[$i] $LINE"

            # Extract current synced height (e.g. "145820/722736")
            HEIGHTS=$(echo "$LINE" | grep -oP '\d+/\d+' | tail -1)
            if [ -n "$HEIGHTS" ]; then
              CURRENT=$(echo "$HEIGHTS" | cut -d/ -f1)
              TOTAL=$(echo "$HEIGHTS" | cut -d/ -f2)
              PCT=$(echo "$HEIGHTS" | awk -F/ '{printf "%.0f", $1/$2*100}')
              echo "Progress: $CURRENT/$TOTAL ($PCT%)"

              # If we've synced past 95% headers, continue — blocks sync fast
              if [ "$CURRENT" -gt 0 ] && [ "$TOTAL" -gt 0 ] 2>/dev/null; then
                if [ "$((CURRENT * 100 / TOTAL))" -ge 95 ] 2>/dev/null; then
                  echo "Header sync past 95%, proceeding..."
                  break
                fi
              fi
            fi

            # Check if node crashed
            ps aux | grep minotari_node | grep -v grep || {
              echo "Node is not running! Log tail:"
              tail -20 /tmp/node.log
              exit 1
            }

            sleep 60
          done
          echo "--- Final log tail ---"
          tail -5 /tmp/node.log
          set -e

      - name: Build harness
        run: cargo build --release --manifest-path harness/Cargo.toml

      - name: Run S1 scenario
        id: s1
        continue-on-error: true
        run: |
          cd harness
          cargo run --release -- --config ../micro_config.toml --scenario S1 2>&1 | tee /tmp/s1_output.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-result
          path: /tmp/s1_output.txt
          retention-days: 30
